name: CI

on:
  push:
    branches: [main, 'devin/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: cd server && npm ci

      - name: Create .env
        run: |
          cat > server/.env << EOF
          PORT=5000
          NODE_ENV=test
          MONGODB_URI=mongodb://localhost:27017/college_erp_test
          JWT_ACCESS_SECRET=ci_test_access_secret
          JWT_REFRESH_SECRET=ci_test_refresh_secret
          ACCESS_TOKEN_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_IN=7d
          BCRYPT_ROUNDS=4
          CLIENT_URL=http://localhost:5173
          COLLEGE_NAME=Test College
          DEFAULT_ADMIN_EMAIL=admin@test.edu
          DEFAULT_ADMIN_PASSWORD=Admin@123
          EOF

      - name: Seed database
        run: cd server && node seed.js

      - name: Start server
        run: cd server && node index.js &
        env:
          NODE_ENV: test

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:5000/api/health && break
            sleep 1
          done

      - name: Run tests
        run: cd server && npx jest --forceExit --detectOpenHandles --testTimeout=30000

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: cd client && npm ci

      - name: Build frontend
        run: cd client && npx vite build
